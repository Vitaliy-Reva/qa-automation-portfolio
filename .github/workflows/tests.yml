name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t qa-tests .

      - name: Run tests in container
        run: |
          docker run --rm \
            -e BASE_URL=${{ secrets.BASE_URL }} \
            -e API_TOKEN=${{ secrets.API_TOKEN }} \
            qa-tests